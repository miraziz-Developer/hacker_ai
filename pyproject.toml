[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hacker-ai"
version = "0.1.0"
description = "Scope-enforced private bug bounty assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "azure-identity>=1.25,<2",
  "httpx>=0.27,<1",
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
hacker-ai = "hacker_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hacker_ai"]

[tool.hatch.build.targets.sdist]
include = ["src/hacker_ai", "tests", "examples", "scripts", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hacker_ai"]
